<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores para mi kelly</title>
    <link rel="stylesheet" href="flores.css">
</head>
<body>
    <div class="text-container">
      <h1>
        Hoy vengo una vez más, con todo mi amor. Te hice estas flores para que siempre las veas,
        flores que no se marchitan y perduran en el tiempo como mi amor por ti.
      </h1>
    </div>
    <div class="flower-container">
        <!-- Primera Flor -->
        <div class="flower">
            <div class="stem"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
            <div class="leaf"></div>
        </div>

        <!-- Segunda Flor -->
        <div class="flower">
            <div class="stem"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
            <div class="leaf"></div>
        </div>

        <!-- Tercera Flor -->
        <div class="flower">
            <div class="stem"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="petal"></div>
            <div class="center"></div>
            <div class="leaf"></div>
        </div>
    </div>
</body>
</html>
